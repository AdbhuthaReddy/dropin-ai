steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - -t
      - '${_IMAGE}'
      - --build-arg
      - 'NEXT_PUBLIC_API_BASE_URL=${_API_URL}'
      - --build-arg
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - --build-arg
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_AUTH_DOMAIN}'
      - --build-arg
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID}'
      - .
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
