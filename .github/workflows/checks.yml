name: Prototype regression checks
on: [push, pull_request]
jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup script regression tests
        shell: powershell
        run: .\tests\setup.Tests.ps1
      - name: Single-service deployment script regression tests
        shell: powershell
        run: .\tests\deploy.Tests.ps1
      - name: Fresh-clone installation
        shell: powershell
        run: .\setup.ps1 -SkipRuntimeInstall
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
        env:
          GEMINI_API_KEY: ""
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build
        env:
          NEXT_PUBLIC_CLOUD_MODE: "true"
          NEXT_PUBLIC_API_BASE_URL: "/"
  combined-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t dropin-demo:test .
      - name: Verify proxy, web and API without cloud credentials or provider calls
        run: |
          docker run -d --name demo -e INVENTORY_DB_PATH=/tmp/inventory.sqlite3 -p 127.0.0.1:8080:8080 dropin-demo:test
          trap 'docker logs demo; docker rm -f demo' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          # No Gemini key in CI: readiness must be proxied to the API and report not configured.
          ready=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/ready)
          test "$ready" = "503"
          curl -fsS http://localhost:8080/api/inventory
          curl -fsS http://localhost:8080/erp-simulator > /tmp/demo-erp.html
          curl -fsS http://localhost:8080/datasheets > /dev/null
          asset=$(grep -oE '/_next/static/[^"]+\.css' /tmp/demo-erp.html | head -n 1)
          test -n "$asset"
          curl -fsS "http://localhost:8080$asset" > /dev/null
