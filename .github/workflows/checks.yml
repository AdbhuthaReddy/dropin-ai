name: Prototype regression checks
on: [push, pull_request]
jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup script regression tests
        shell: powershell
        run: .\tests\setup.Tests.ps1
      - name: Fresh-clone installation
        shell: powershell
        run: .\setup.ps1 -SkipRuntimeInstall
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
        env:
          GEMINI_API_KEY: ""
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build
        env:
          NEXT_PUBLIC_CLOUD_MODE: "true"
          NEXT_PUBLIC_API_BASE_URL: "https://api.example.invalid"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-dropin"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "demo-dropin.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "demo-build-not-a-secret"
